<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stezhka</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- Login -->
    <div id="login" class="login" hidden>
      <form id="login-form" class="card login-card" method="post" action="/">
        <div class="brand brand-lg">
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z" />
          </svg>
          Stezhka
        </div>
        <p class="muted">Sign in to see where your tracker is.</p>

        <label class="field">
          <span>E-mail</span>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>

        <button id="login-submit" type="submit" class="btn btn-primary">Sign in</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </div>

    <!-- App -->
    <div id="app" class="app" hidden>
      <div id="map"></div>

      <section class="card panel" aria-label="Tracker">
        <header class="panel-head">
          <div class="brand">
            <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z" />
            </svg>
            Stezhka
          </div>
          <button id="logout" type="button" class="btn btn-secondary btn-sm">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 16l4-4-4-4M19 12H9" />
            </svg>
            Sign out
          </button>
        </header>

        <div class="status">
          <span id="status-dot" class="status-dot none"></span>
          <div>
            <strong id="device-name">Tracker</strong>
            <div id="status-text" class="muted">Connecting…</div>
          </div>
          <span id="battery" class="battery" hidden>
            <span class="battery-body"><span id="battery-fill" class="battery-fill"></span></span>
            <span id="battery-text"></span>
          </span>
        </div>

        <dl class="stats">
          <div><dt>Speed</dt><dd id="stat-speed">–</dd></div>
          <div><dt>Satellites</dt><dd id="stat-sats">–</dd></div>
          <div><dt>Accuracy</dt><dd id="stat-accuracy">–</dd></div>
          <div><dt>Altitude</dt><dd id="stat-alt">–</dd></div>
        </dl>

        <details id="net-details" class="details">
          <summary>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01" /></svg>
            <span><span class="details-title">Connection</span><span id="net-summary" class="muted">–</span></span>
          </summary>
          <dl id="net-rows" class="rows"></dl>
        </details>

        <details id="gps-details" class="details">
          <summary>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /><circle cx="12" cy="12" r="7" /><circle cx="12" cy="12" r="2.5" /></svg>
            <span><span class="details-title">GPS</span><span id="gps-summary" class="muted">–</span></span>
          </summary>
          <dl id="gps-rows" class="rows"></dl>
        </details>

        <details id="dev-details" class="details">
          <summary>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2" /><path d="M22 11v2" /></svg>
            <span><span class="details-title">Device</span><span id="dev-summary" class="muted">–</span></span>
          </summary>
          <dl id="dev-rows" class="rows"></dl>
        </details>

        <button id="coords" type="button" class="coords" title="Copy coordinates" disabled>–</button>

        <div class="actions">
          <button id="center" type="button" class="btn btn-secondary" disabled>Center on map</button>
          <a id="gmaps" class="btn btn-secondary is-disabled" target="_blank" rel="noopener">Google Maps</a>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
